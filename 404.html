<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Carreographer</title>
    <link rel="canonical" href="https://matthewhager.github.io/carreographer/" />
    <script>
      // keep whatever came after the old path (a deep link, a query, a hash)
      const rest = location.pathname.replace(/^\/[^/]+/, '') || '/';
      location.replace('https://matthewhager.github.io/carreographer' + rest + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://matthewhager.github.io/carreographer/" />
  </head>
  <body>
    <p>Carreographer has moved to <a href="https://matthewhager.github.io/carreographer/">matthewhager.github.io/carreographer</a>.</p>
  </body>
</html>
