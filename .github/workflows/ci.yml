# The app's type check, lint and tests, on every push and pull request.
name: ci
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc -b && npx tsc -p tools/review
      - run: npx oxlint src tools
      - run: npx vitest run
